<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BYN Leadership Hub</title>
<meta name="description" content="Curated leadership training resources for the BYN team.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#1B2A4A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BYN Hub">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B2A4A;
    --ink-2:#26375c;
    --gold:#C9A227;
    --gold-2:#e0bc47;
    --clay:#B5533C;
    --paper:#F7F5EF;
    --paper-2:#efece2;
    --charcoal:#2A2A28;
    --line: rgba(27,42,74,0.14);
    --shadow: 0 8px 24px rgba(27,42,74,0.10);
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',sans-serif;background:var(--paper);color:var(--charcoal);}
  h1,h2,h3,.display{font-family:'Fraunces',serif;}
  .mono{font-family:'IBM Plex Mono',monospace;}

  /* Layout */
  .app{display:flex;min-height:100vh;}
  .rail{
    width:260px;flex-shrink:0;background:var(--ink);color:#fff;
    padding:28px 0 28px 0;position:relative;display:flex;flex-direction:column;
  }
  .rail-header{padding:0 24px 24px 24px;border-bottom:1px solid rgba(255,255,255,0.12);margin-bottom:18px;}
  .rail-header .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--gold-2);opacity:0.9;}
  .rail-header h1{font-size:26px;margin:6px 0 0 0;line-height:1.15;font-weight:600;}

  .ladder{list-style:none;margin:0;padding:0;position:relative;flex:1;}
  .ladder::before{
    content:"";position:absolute;left:38px;top:6px;bottom:6px;width:2px;
    background:linear-gradient(to bottom, rgba(201,162,39,0.15), rgba(201,162,39,0.55));
  }
  .rung{position:relative;}
  .rung button{
    all:unset;display:flex;align-items:center;gap:14px;width:100%;
    padding:14px 24px 14px 22px;cursor:pointer;color:rgba(255,255,255,0.72);
    transition:background 0.15s ease,color 0.15s ease;
  }
  .rung button:hover{background:rgba(255,255,255,0.05);color:#fff;}
  .rung.active button{background:rgba(201,162,39,0.14);color:#fff;}
  .rung.active .dot{background:var(--gold);box-shadow:0 0 0 4px rgba(201,162,39,0.22);}
  .dot{
    width:14px;height:14px;border-radius:50%;background:var(--ink-2);
    border:2px solid rgba(255,255,255,0.35);flex-shrink:0;z-index:1;
    transition:all 0.15s ease;
  }
  .rung-label{display:flex;flex-direction:column;gap:2px;}
  .rung-title{font-size:14.5px;font-weight:600;}
  .rung-count{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:rgba(255,255,255,0.45);}
  .rail-footer{padding:18px 24px 0 24px;border-top:1px solid rgba(255,255,255,0.12);margin-top:12px;}
  .rail-footer p{font-size:11.5px;color:rgba(255,255,255,0.45);line-height:1.5;margin:0;}

  .main{flex:1;padding:40px 48px 64px;max-width:1000px;}
  .main-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:6px;flex-wrap:wrap;}
  .main-head .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--clay);}
  .main-head h2{font-size:34px;margin:4px 0 0 0;font-weight:600;}
  .section-desc{color:#5a5a55;font-size:15px;margin:10px 0 28px 0;max-width:62ch;line-height:1.55;}

  .toolbar{display:flex;gap:12px;margin-bottom:22px;flex-wrap:wrap;align-items:center;}
  .search{
    flex:1;min-width:220px;position:relative;
  }
  .search input{
    width:100%;padding:11px 14px 11px 38px;border-radius:8px;border:1px solid var(--line);
    background:#fff;font-family:'Inter',sans-serif;font-size:14px;color:var(--charcoal);
  }
  .search input:focus{outline:2px solid var(--gold);outline-offset:1px;}
  .search::before{
    content:"";position:absolute;left:13px;top:50%;transform:translateY(-50%);
    width:14px;height:14px;border:2px solid #9a9a90;border-radius:50%;
  }
  .search::after{
    content:"";position:absolute;left:22px;top:63%;width:7px;height:2px;background:#9a9a90;transform:rotate(45deg);
  }
  select.filter{
    padding:11px 14px;border-radius:8px;border:1px solid var(--line);background:#fff;
    font-family:'Inter',sans-serif;font-size:14px;color:var(--charcoal);cursor:pointer;
  }
  select.filter:focus{outline:2px solid var(--gold);outline-offset:1px;}
  .btn{
    all:unset;padding:11px 18px;border-radius:8px;background:var(--ink);color:#fff;
    font-family:'Inter',sans-serif;font-weight:600;font-size:14px;cursor:pointer;
    display:inline-flex;align-items:center;gap:8px;transition:background 0.15s ease;
  }
  .btn:hover{background:var(--ink-2);}
  .btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
  .btn-plus::before{content:"+";font-size:17px;line-height:0;font-weight:700;}
  .btn-ghost{all:unset;padding:9px 14px;border-radius:7px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink);border:1px solid var(--line);background:#fff;}
  .btn-ghost:hover{background:var(--paper-2);}
  .btn-danger{color:var(--clay);}

  /* Cards */
  .grid{display:flex;flex-direction:column;gap:12px;}
  .card{
    background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px 20px;
    box-shadow:var(--shadow);display:flex;justify-content:space-between;gap:16px;align-items:flex-start;
  }
  .card-main{flex:1;min-width:0;}
  .card-top{display:flex;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap;}
  .tag{
    font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.06em;text-transform:uppercase;
    padding:3px 8px;border-radius:5px;font-weight:500;
  }
  .tag-book{background:#eef1e6;color:#556b2f;}
  .tag-video{background:#fbe9e4;color:var(--clay);}
  .tag-audio{background:#eee6f5;color:#6a4c93;}
  .tag-article{background:#e6eef5;color:#2f5c8a;}
  .tag-link{background:#f5efe0;color:#96731a;}
  .card h3{font-size:17px;margin:0 0 4px 0;font-weight:600;line-height:1.3;}
  .card-meta{font-size:13px;color:#7a7a72;margin-bottom:6px;}
  .card p.desc{font-size:14px;color:#4c4c46;line-height:1.5;margin:6px 0 0 0;}
  .card a.url{font-size:13px;color:var(--ink-2);text-decoration:none;border-bottom:1px solid var(--line);}
  .card a.url:hover{border-color:var(--ink-2);}
  .card-actions{display:flex;gap:8px;flex-shrink:0;}
  .icon-btn{
    all:unset;width:30px;height:30px;border-radius:6px;display:flex;align-items:center;justify-content:center;
    cursor:pointer;color:#8a8a80;transition:background 0.15s;
  }
  .icon-btn:hover{background:var(--paper-2);color:var(--charcoal);}
  .icon-btn.danger:hover{background:#fbe9e4;color:var(--clay);}

  .empty{
    text-align:center;padding:60px 20px;color:#9a9a90;
  }
  .empty .display{font-size:20px;color:var(--ink);margin-bottom:8px;}
  .empty p{font-size:14px;max-width:38ch;margin:0 auto;}

  /* Modal */
  .overlay{
    position:fixed;inset:0;background:rgba(27,42,74,0.45);display:flex;align-items:center;justify-content:center;
    padding:20px;z-index:50;
  }
  .modal{
    background:#fff;border-radius:12px;width:100%;max-width:480px;padding:28px;box-shadow:0 20px 60px rgba(0,0,0,0.25);
    max-height:88vh;overflow-y:auto;
  }
  .modal h3{margin:0 0 20px 0;font-size:21px;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:12.5px;font-weight:600;color:#5a5a55;margin-bottom:6px;text-transform:uppercase;letter-spacing:0.03em;}
  .field input, .field select, .field textarea{
    width:100%;padding:10px 12px;border-radius:7px;border:1px solid var(--line);
    font-family:'Inter',sans-serif;font-size:14px;color:var(--charcoal);background:var(--paper);
  }
  .field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--gold);outline-offset:1px;background:#fff;}
  .field textarea{resize:vertical;min-height:64px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px;}

  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:#fff;padding:12px 20px;border-radius:8px;font-size:14px;
    box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity 0.25s ease, transform 0.25s ease;
    z-index:60;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}

  .loading{padding:60px;text-align:center;color:#9a9a90;font-size:14px;}

  @media (max-width: 820px){
    .app{flex-direction:column;}
    .rail{width:100%;padding:20px 0;}
    .ladder{display:flex;overflow-x:auto;gap:2px;padding:0 12px;}
    .ladder::before{display:none;}
    .rung button{padding:10px 14px;white-space:nowrap;}
    .main{padding:28px 20px 48px;}
  }
  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;}
  }
</style>
</head>
<body>
<div id="root"></div>

<script>
const SECTIONS = [
  { id:"g2-leaders", title:"G2 Leaders", short:"G2-L", description:"Curated resources to sharpen your leadership and deepen your walk in faith." },
  { id:"g2-lessons", title:"G2 Lessons", short:"G2", description:"Lessons to use with your G2 small groups." },
  { id:"hs-leadership", title:"HS Student Leadership Lessons", short:"HS" },
  { id:"byn-training", title:"All BYN Leadership Training Resources", short:"ALL" },
  { id:"g3-leadership", title:"G3 Leadership", short:"G3-L" },
  { id:"g3-lessons", title:"G3 Lessons", short:"G3" },
  { id:"fnl", title:"FNL", short:"FNL" },
];

const TYPE_LABELS = { book:"Book", video:"Video", audio:"Audio", article:"Article", link:"Link" };

// Resources every visitor sees by default, before any local edits.
// Seeded once into each browser's local storage on first load.
const DEFAULT_RESOURCES = {
  "g2-lessons": [
    {
      id:"seed-g2l-foundations", title:"Foundations of Faith — Small Group Guide", type:"book",
      author:"Kelly Weightman",
      url:"files/g2-leaders/foundations-of-faith-small-group.docx",
      description:"15 lessons (Truth, The Bible, Sovereignty of God, Creator God, Sinful Nature, Consequences of Sin, Jesus 100%, Grace, The Significance of the Gospel, Grace Makes Us Gracious, The Holy Spirit, Eternal Security, Fellowship Parts 1 & 2, Restoration) built for 30-minute discussions, based on the \"Foundations of Faith\" chapter of Deep Dive: Daily Dives Into God's Word.",
      addedAt: new Date().toISOString()
    },
    {
      id:"seed-g2l-jesus", title:"Getting to Know Jesus — Small Group Guide", type:"book",
      author:"Kelly Weightman",
      url:"files/g2-leaders/getting-to-know-jesus-small-group.docx",
      description:"16 lessons (Seeing God, Jesus the Creator, God's Personal Touch, Forgiveness Proven, The Inviter, Our Great High Priest, God of Freedom, Yoked with Jesus, The Emotions of God, Friendship with Jesus, Super Servant, The One Who Quells Chaos, The One Who Endures, Heart of Gold, The Finisher, His Aim = Our Belief) built for 30-minute discussions, based on the \"Getting to Know Jesus\" chapter of Deep Dive: Daily Dives Into God's Word.",
      addedAt: new Date().toISOString()
    },
    {
      id:"seed-g2l-hottopics", title:"Hot Topics — Small Group Guide", type:"book",
      author:"Kelly Weightman",
      url:"files/g2-leaders/hot-topics-small-group.docx",
      description:"7 lessons — Friendship, Dating, Emotions, Initiative, Purity, Integrity, and Generosity — built for 30-minute discussions, based on the \"Hot Topics\" chapter of Deep Dive: Daily Dives Into God's Word.",
      addedAt: new Date().toISOString()
    },
  ],
};

let state = {
  loaded:false,
  active: SECTIONS[0].id,
  resources: {},   // sectionId -> array of resource objects
  search: "",
  filterType: "all",
};

function loadAll(){
  for(const s of SECTIONS){
    state.resources[s.id] = DEFAULT_RESOURCES[s.id] ? [...DEFAULT_RESOURCES[s.id]] : [];
  }
  state.loaded = true;
  render();
}

function setActive(id){ state.active = id; state.search=""; state.filterType="all"; render(); }

function filteredResources(){
  const list = state.resources[state.active] || [];
  return list.filter(r=>{
    const matchesType = state.filterType==='all' || r.type===state.filterType;
    const q = state.search.trim().toLowerCase();
    const matchesSearch = !q || (r.title+" "+(r.author||"")+" "+(r.description||"")).toLowerCase().includes(q);
    return matchesType && matchesSearch;
  });
}

function iconSvg(name){
  const icons = {
    external: `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><path d="M15 3h6v6"></path><path d="M10 14 21 3"></path></svg>`,
  };
  return icons[name] || "";
}

function render(){
  const root = document.getElementById('root');
  if(!state.loaded){
    root.innerHTML = `<div class="loading">Loading BYN Leadership Hub…</div>`;
    return;
  }

  const activeSection = SECTIONS.find(s=>s.id===state.active);
  const items = filteredResources();

  const rail = `
    <nav class="rail" aria-label="Leadership sections">
      <div class="rail-header">
        <div class="eyebrow">BYN Leadership</div>
        <h1>Leadership Hub</h1>
      </div>
      <ul class="ladder">
        ${SECTIONS.map(s=>`
          <li class="rung ${s.id===state.active?'active':''}">
            <button data-nav="${s.id}">
              <span class="dot"></span>
              <span class="rung-label">
                <span class="rung-title">${s.title}</span>
                <span class="rung-count mono">${(state.resources[s.id]||[]).length} resource${(state.resources[s.id]||[]).length===1?'':'s'}</span>
              </span>
            </button>
          </li>
        `).join('')}
      </ul>
      <div class="rail-footer">
        <p>A read-only library curated by BYN leadership — browse, search, and open resources for each stage of leadership development.</p>
      </div>
    </nav>
  `;

  const cards = items.length ? items.map(r=>`
    <div class="card">
      <div class="card-main">
        <div class="card-top">
          <span class="tag tag-${r.type}">${TYPE_LABELS[r.type]||r.type}</span>
          ${r.author?`<span class="card-meta">${escapeHtml(r.author)}</span>`:''}
        </div>
        <h3>${escapeHtml(r.title)}</h3>
        ${r.description?`<p class="desc">${escapeHtml(r.description)}</p>`:''}
        ${r.url?`<div style="margin-top:8px;"><a class="url" href="${escapeAttr(r.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(r.url)} ${iconSvg('external')}</a></div>`:''}
      </div>
    </div>
  `).join('') : `
    <div class="empty">
      <div class="display">Nothing here yet</div>
      <p>No resources have been added to ${escapeHtml(activeSection.title)} yet — check back soon.</p>
    </div>
  `;

  root.innerHTML = `
    <div class="app">
      ${rail}
      <main class="main">
        <div class="main-head">
          <div>
            <div class="eyebrow">Section</div>
            <h2>${activeSection.title}</h2>
          </div>
        </div>
        <p class="section-desc">${escapeHtml(activeSection.description || "Curated training material for this stage of leadership development.")}</p>

        <div class="toolbar">
          <div class="search">
            <input type="text" id="searchInput" placeholder="Search this section…" value="${escapeAttr(state.search)}">
          </div>
          <select class="filter" id="typeFilter">
            <option value="all" ${state.filterType==='all'?'selected':''}>All types</option>
            <option value="book" ${state.filterType==='book'?'selected':''}>Books</option>
            <option value="video" ${state.filterType==='video'?'selected':''}>Videos</option>
            <option value="audio" ${state.filterType==='audio'?'selected':''}>Audio</option>
            <option value="article" ${state.filterType==='article'?'selected':''}>Articles</option>
            <option value="link" ${state.filterType==='link'?'selected':''}>Links</option>
          </select>
        </div>

        <div class="grid">${cards}</div>
      </main>
    </div>
  `;

  attachHandlers();
}

function escapeHtml(s){
  if(s===undefined || s===null) return '';
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s){ return escapeHtml(s); }

function attachHandlers(){
  document.querySelectorAll('[data-nav]').forEach(btn=>{
    btn.addEventListener('click', ()=> setActive(btn.getAttribute('data-nav')));
  });

  const searchInput = document.getElementById('searchInput');
  if(searchInput){
    searchInput.addEventListener('input', (e)=>{ state.search = e.target.value; render(); preserveFocus('searchInput'); });
  }
  const typeFilter = document.getElementById('typeFilter');
  if(typeFilter){
    typeFilter.addEventListener('change', (e)=>{ state.filterType = e.target.value; render(); });
  }
}

function preserveFocus(id){
  const el = document.getElementById(id);
  if(el){ el.focus(); const v=el.value; el.value=''; el.value=v; }
}

loadAll();
</script>
</body>
</html>
